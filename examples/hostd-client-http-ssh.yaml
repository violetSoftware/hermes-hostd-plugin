# NONSECRET legacy flat config for an already established SSH local forward.
# Copy deliberately to $HERMES_HOME/hostd-client.yaml; do not include credentials.
transport: http
# Loopback is the Hermes machine/network namespace, not the physical VM/container host.
# Establish SSH externally first: local port 19998 forwards to daemon port 9998.
# This URL matches that local listening port, not the HTTP fallback port 9998.
# The plugin does not establish tunnels automatically.
http_url: http://127.0.0.1:19998/execute

# Configure matching HOSTD_AUTH_TOKEN through Hermes profile-managed secrets.
# No client token-file selector: rc2 rejects auth_token_file / HOSTD_AUTH_TOKEN_FILE.
