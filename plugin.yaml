name: hostd-client
version: "0.1.0rc2"
author: Violet Software
license: MIT
manifest_version: 2
description: Request command execution from a separately managed hermes-hostd daemon
requires_hermes: ">=0.22.5"
platforms: [linux]
tags: [incus, host, approval, vsock]
provides_tools:
  - run_on_host
provides_hooks: []
# No built-in override, LLM override or gateway platform-action grants.
# Remote command authority is disclosed in README; it is not a capability ID.
capabilities: []
# Authenticated catalog/default operation requires this Hermes-managed secret.
requires_env: [HOSTD_AUTH_TOKEN]
optional_env:
  - HOSTD_TRANSPORT
  - HOSTD_VSOCK_PORT
  - HOSTD_HTTP_URL

python_dependencies: []
config_schema:
  max_response_bytes:
    type: int
    default: 1048576
    required: false
    description: "Positive finite response-byte ceiling before decoding/parsing, including VSOCK newline. Default 1 MiB accommodates bounded daemon tails and ordinary metadata/errors."

  insecure_no_auth:
    type: bool
    default: false
    required: false
    description: "Explicit unsafe standalone/manual opt-out. Warns; never selected by missing credentials. Hermes catalog/default availability still requires HOSTD_AUTH_TOKEN; token and opt-out are mutually exclusive."
  transport:
    type: str
    default: vsock
    required: false
    description: "Transport: vsock or http. Legacy hostd-client.yaml and HOSTD_TRANSPORT take precedence."
  vsock_port:
    type: int
    default: 9999
    required: false
    description: "Host CID 2 VSOCK port. Must match the separately managed daemon."
  http_url:
    type: str
    # Loopback is the Hermes machine/network namespace, not a VM/container's host.
    # Use the local daemon here, or configure an endpoint/external SSH local forward.
    default: http://127.0.0.1:9998/execute
    required: false
    description: >-
      Full HTTP endpoint. Loopback refers to the machine/network namespace running
      Hermes, not the physical host when Hermes runs in a VM/container. No URL
      override is needed for a local daemon at the default endpoint. Otherwise
      explicitly configure the daemon endpoint, or establish an external SSH local
      forward and configure this URL to match its local listening port. The plugin
      does not establish tunnels automatically. No credentials in URLs.
